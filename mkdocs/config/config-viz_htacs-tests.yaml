# Config viz pour le dataset hemianotACS (stimulation FEF).
# Calqué sur config-viz_stimSD.yaml.
# ============================================================

# ── Cohorte ─────────────────────────────────────────────────
subjects:
  ids: ["0001", "0002", "0008"] # "0009", "0011", "0014","0015",]
        # "0016","0018","0021","0023","0024","0026","0027",
        # "0029","0035","0037","0038","0040","0041"]
  # ids: ["sub-0001", "sub-0002", "sub-0008", "sub-0009", "sub-0011", "sub-0014","sub-0015",
  #       "sub-0016","sub-0018","sub-0021","sub-0023","sub-0024","sub-0026","sub-0027",
  #       "sub-0029","sub-0035","sub-0037","sub-0038","sub-0040","sub-0041"]      
  stim_pattern: "fef"
  # TODO gérer les groupes de sujets left and right (hémianopsie latéralisée)

# ⚠ ASSUMÉS — tu ne m'as donné que le chemin des lésions. À CONFIRMER :
#   - seg_base / sim_base : noms des sous-dossiers (repris de stimSD)
#   - le pattern m2m : run-viz cherche seg_base/<id>/m2m_<id> → ici m2m_sub-0001.
#     Si tes m2m s'appellent m2m_0001 (sans 'sub-'), enlève le préfixe des ids
#     OU adapte le f-string dans run-viz.load_subjects().
paths:
  seg_base: "/Volumes/levy/raw/valerocabre/hemianotACS/Data/derivatives/mri/1-simnibs-preps-maskSS"
  sim_base: "/Volumes/levy/raw/valerocabre/hemianotACS/Data/derivatives/mri/2-simnibs-sim-ips-fef"
  out_root: "/Volumes/levy/raw/valerocabre/hemianotACS/Analysis/simnibs-figures-test6"

# ── Échelle e-field (verrouillée pour toute la cohorte) ─────
fields_scale:
  min: 0.05
  max: 0.4
  # for later ! symmetric scale
  # for later ! space: mni or native

# ── Registre de layers réutilisables (référencés par nom) ───
vols:

  anat_skull:
    kind: anat
    source: t1
    colormap: gray
    opacity: 0.5

  anat_brain:
    kind: anat
    source: brain_mask
    colormap: gray
    opacity: 0.5

  # FEF : PAS un label Harvard-Oxford → défini par coordonnées MNI (sphère).
  # ⚠ Coordonnée FEF approximative + latéralité à fixer (étude hémianopsie).
  #   Gauche ~ [-30, -2, 48] ; droite ~ [30, -2, 48] (Paus 1996 / Amiez).
  roi_fef:
    kind: roi
    coords: [30, -2, 48]   # MNI ; le script envoie en natif
    radius: 10.0
    colormap: blue
    opacity: 0.5

  efield:
    kind: field
    name: magnE
    colormap: hot
    opacity: 0.6

  lesion:
    kind: anat
    source: lesion_native   # résolu par sujet via seg.lesion_native
    colormap: red
    opacity: 0.7

# ── Blocks de figures ───────────────────────────────────────
figures:

  # A2 — anat ortho : T1 + ROI FEF (contour) + lésion (contour)
  # - name: "A2_anat_FEF_lesion_ortho"
  #   type: "2D"
