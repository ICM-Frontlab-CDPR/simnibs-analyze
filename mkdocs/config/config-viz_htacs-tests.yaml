  # ── Figures avec lésion ──────────────────────────────────────────────────
  - name: "C1_structural_lesion_ortho"
    type: "2D"
    subtype: "ortho"
    vols: [anat_brain, lesion, roi_fef]
    cut_center_vol: roi_fef
    contour_vols: [lesion, roi_fef]   # lésion en contour rouge
    cohort: true

