running:
  if_exists: "skip"   # "skip" | "overwrite" | "error"

# Paths — structure séparée preps / simu / results
paths:
  simnibs_preps: /Volumes/levy/raw/valerocabre/stimSD/Data/derivatives/mri/1-simnibs-preps
  simnibs_simu:  /Volumes/levy/raw/valerocabre/stimSD/Data/derivatives/mri/2-simnibs-simu
  results_dir:   /Volumes/levy/raw/valerocabre/stimSD/Data/derivatives/mri/3-simnibs-analyze
  mni_template:  /Users/hippolyte.dreyfus/Documents/simnibs-modular/templates/MNI152_T1_1mm.nii.gz
  mni_brain_mask: /Users/hippolyte.dreyfus/Documents/simnibs-modular/templates/MNI152_T1_1mm_brain_mask.nii.gz

subjects:
  - "0001"
  - "0005"
  - "0006"
  - "0007"
  - "0008"
  - "0010"
  - "0014"
  - "0016"
  - "0017"
  - "0018"
  - "0020"
  - "0021"
  - "0022"
  - "0030"
  - "0031"
  - "0032"

# Montage AF7 (anode) – FT8 (cathode) → cible fonctionnelle : DLPFC gauche
stim_conditions: [AFFT, FTAF]
mode: [simulation]
space: mni

# ROI : anterior temporal (AAL) — droit pour AFFT, gauche pour FTAF
target_generation:
  rois:
    AFFT:
      method: atlas
      atlas: aal
      regions: ["Temporal_Pole_Sup_R", "Temporal_Pole_Mid_R"]
    FTAF:
      method: atlas
      atlas: aal
      regions: ["Temporal_Pole_Sup_L", "Temporal_Pole_Mid_L"]

# Preprocessing
preprocessing:
  smooth_fwhm: 2.0
  outlier_method: iqr
  portion: null

# Feature extraction
feature_extraction:
  metrics: [mean, median, std, min, max]

# Analysis
analysis:
  metric: mean
  subject_col: subject
  condition_col: condition
  clustering:
    method: mean
    specificity_threshold: 1.5
    intensity_col: mean

