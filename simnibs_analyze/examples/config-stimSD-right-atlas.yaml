# Montage AF7 (anode) – FT8 (cathode) → cible fonctionnelle : DLPFC gauche
stim_conditions: [AFFT, FTAF] #-right
mode: [simulation]
space: mni

# ROI : sphère MNI DLPFC gauche (sous AF7)
target_generation:
  rois:
    AFFT:
      method: atlas
      atlas: aal
      regions: ["Temporal_Pole_Sup_R", "Temporal_Pole_Mid_R"]
    FTAF:
      method: atlas
      atlas: aal
      regions: ["Temporal_Pole_Sup_R", "Temporal_Pole_Mid_R"]

# Preprocessing
preprocessing:
  smooth_fwhm: 2.0
  outlier_method: iqr
  portion: null

# Feature extraction
feature_extraction:
  metrics: [mean, median, std, min, max]

# Analysis
analysis:
  metric: mean
  subject_col: subject
  condition_col: condition
  clustering:
    method: mean
    specificity_threshold: 1.5
    intensity_col: mean

