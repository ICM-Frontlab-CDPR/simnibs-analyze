# Configuration for hemianotACS e-field analysis pipeline
subjects: ["0001"] # , "0002", "0004", "0005", "0007", "0008", "0009", "0011", "0012", "0014", "0015", "0016", "0018", "0019", "0020", "0021", "0023", "0024", "0025", "0026", "0027", "0028", "0029", "0030", "0031", "0032", "0033", "0034", "0035", "0036", "0037", "0038", "0039", "0040", "0041", "0042"]
stim_conditions: [fef, ips_left, ips_right]
mode: [simulation, optimization]

# ROI definitions — MNI coordinates [x, y, z] in mm
rois:
  fef: [28, -8, 54]
  ips_left: [-25, -60, 52]
  ips_right: [25, -60, 52]

# Target generation parameters
target_generation:
  radius_mm: 10.0

# Paths
paths:
  simnibs_output: /Users/hippolyte.dreyfus/Desktop/hemianotACS/Data/derivatives/simnibs-config-healthyV2
  results_dir: /Users/hippolyte.dreyfus/Desktop/hemianotACS/Data/derivatives/simnibs-config-healthyV2/results-V2
  mni_template: /Users/hippolyte.dreyfus/Documents/FRONTLAB-SimNIBS-pipeline/templates/MNI152_T1_1mm.nii.gz
  mni_brain_mask: /Users/hippolyte.dreyfus/Documents/FRONTLAB-SimNIBS-pipeline/templates/MNI152_T1_1mm_brain_mask.nii.gz

# Preprocessing parameters
preprocessing:
  smooth_fwhm: 2.0
  outlier_method: iqr
  portion: null

# Feature extraction parameters
feature_extraction:
  metrics: [mean, median, std, min, max]

# Analysis parameters
analysis:
  metric: mean
  subject_col: subject
  condition_col: condition
  clustering:
    method: mean              # colonne efield_ratio_<method> utilisée
    specificity_threshold: 1.5
    intensity_col: mean       # colonne numérique pour seuil haut/bas
  





